<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resource Management</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans p-6 flex flex-col justify-center items-center">

    <div class="max-w-md w-full space-y-6">

        <!-- Section 1: Generate OTP & Countdown -->
        <div class="bg-slate-800/60 border border-slate-700/80 rounded-xl p-5 shadow-lg backdrop-blur-sm">
            <h2 class="text-sm font-bold text-white tracking-wide uppercase mb-3">Generate OTP</h2>
            <div class="mb-4">
                <label for="session-duration" class="block text-slate-300 text-xs mb-1">Session Duration</label>
                <select id="session-duration" class="w-full px-3 py-2 text-xs bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none focus:border-blue-500 mb-2">
                    <option value="900" selected>15 minutes</option>
                    <option value="3600">1 hour</option>
                    <option value="43200">12 hours</option>
                </select>
                <div class="flex items-center gap-2">
                    <input type="checkbox" id="session-readonly" checked class="rounded bg-slate-900 border-slate-700 text-blue-600 focus:ring-0 focus:ring-offset-0">
                    <label for="session-readonly" class="text-slate-300 text-xs">Readonly</label>
                </div>
            </div>
            <button id="generate-otp-btn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium text-xs py-2 px-3 rounded-lg cursor-pointer transition-colors mb-4 disabled:opacity-50 disabled:cursor-not-allowed" disabled">
                Generate OTP
            </button>
            <div class="flex justify-between items-center bg-slate-900/50 border border-slate-700/50 rounded-lg p-3 text-xs">
                <div>
                    <span class="text-slate-400 block mb-0.5">OTP</span>
                    <span id="otp-display" class="font-mono text-white text-sm tracking-wider">------</span>
                </div>
                <div class="text-right">
                    <span class="text-slate-400 block mb-0.5">Expires in</span>
                    <span id="otp-countdown" class="font-mono text-amber-400">--</span>
                </div>
            </div>
        </div>

        <!-- Section 2: Attach Key -->
        <div class="bg-slate-800/60 border border-slate-700/80 rounded-xl p-5 shadow-lg backdrop-blur-sm">
            <h2 class="text-sm font-bold text-white tracking-wide uppercase mb-3">Resource Access Key</h2>
            <button id="attach-key-btn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-xs py-2 px-3 rounded-lg cursor-pointer transition-colors disabled:opacity-50 disabled:cursor-not-allowed" {% if attach_key_disabled %}disabled{% endif %}>
                Attach key
            </button>
        </div>

        <!-- Section 3: Close Resource -->
        <div class="bg-slate-800/60 border border-slate-700/80 rounded-xl p-5 shadow-lg backdrop-blur-sm">
            <h2 class="text-sm font-bold text-white tracking-wide uppercase mb-3">Terminate Resource</h2>
            <button id="close-resource-btn" onclick="sendSessionDone()" class="w-full bg-rose-600 hover:bg-rose-500 text-white font-medium text-xs py-2 px-3 rounded-lg cursor-pointer transition-colors">
                Close resource
            </button>
        </div>

    </div>

    <!-- 1. YOUR NEW ES6 MODULE SCRIPT (Handles the setup and postMessage) -->
    <script type="module">
      window.addEventListener('message', async (event) => {
        const { type, scriptPath, cryptoKey, rules } = event.data;

        if (type === 'SETUP_TRANSCODER') {
          try {
            const module = await import(scriptPath);
            const TranscoderClass = module.default;

            // CRITICAL BRIDGE: Attach it directly to window.
            // This makes it visible to the classic script below.
            window.transcoderInstance = new TranscoderClass(cryptoKey, rules);

            // Notify the classic script that the transcoder is officially initialized
            window.dispatchEvent(new CustomEvent('transcoder-ready'));
          } catch (err) {
            console.error("Failed to initialize transcoder:", err);
          }
        }
      });
    </script>

    <script>

        async function decodeStringParam(param) {
            if (!window.transcoderInstance) {
                alert("Transcoder is still loading...");
                return "";
            }

            try {
                const result = await window.transcoderInstance.decode_str(param);
                return result
            } catch (error) {
                console.error("String decoding operations failed:", error);
            }
            return ""
        }
        
        let countdownTimer = null;

        // Section 1: Generate OTP & Handle Countdown
        const otpBtn = document.getElementById('generate-otp-btn')
        otpBtn.addEventListener('click', async () => {
            const duration = parseInt(document.getElementById('session-duration').value, 10);
            const readonly = document.getElementById('session-readonly').checked;
            
            try {
                const response = await fetch('/api/otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ duration: duration, readonly: readonly })
                });
                
                if (!response.ok) throw new Error('Failed to generate OTP');

                const data = await response.json();

                const otp = await decodeStringParam(data.otp);
                document.getElementById('otp-display').textContent = otp;
                
                if (countdownTimer) clearInterval(countdownTimer);
                
                let remainingSeconds = data.expiry;
                const countdownElem = document.getElementById('otp-countdown');
                
                countdownTimer = setInterval(() => {
                    if (remainingSeconds <= 0) {
                        clearInterval(countdownTimer);
                        countdownElem.textContent = 'Expired';
                        document.getElementById('otp-display').textContent = '------';
                    } else {
                        countdownElem.textContent = `${remainingSeconds}s`;
                        remainingSeconds--;
                    }
                }, 1000);
                
            } catch (error) {
                console.error(error);
                alert('Error generating OTP');
            }
        });

        /**
        // Section 2: Attach Key (GET request)
        document.getElementById('attach-key-btn').addEventListener('click', async () => {
            try {
                const response = await fetch('/access', { method: 'GET' });
                if (response.ok) {
                    alert('Key attached successfully.');
                } else {
                    alert('Failed to attach key.');
                }
            } catch (error) {
                console.error(error);
                alert('Error attaching key.');
            }
        });
        */
        document.getElementById('attach-key-btn')?.addEventListener('click', (event) => {
            event.preventDefault();
            {% if not attach_key_disabled %}
            // Send message to parent frame to display the keymaker module
            window.parent.postMessage({ type: 'SHOW_KEYMAKER' }, '*');
            {% else %}
            alert('You have discovered a bug! You shouldn\'t be able to click the button.');
            {% endif %}
        });

        /**
        // Section 3: Close Resource (POST request)
        document.getElementById('close-resource-btn').addEventListener('click', async () => {
            try {
                const response = await fetch('/resource', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'close' })
                });
                if (response.ok) {
                    alert('Resource closed successfully.');
                } else {
                    alert('Failed to close resource.');
                }
            } catch (error) {
                console.error(error);
                alert('Error closing resource.');
            }
        });
        */
        // Handles sending the completion event to the parent window
        function sendSessionDone() {
            window.parent.postMessage({ type: 'SESSION_DONE' }, window.location.origin);
        }
        
        // Wait for the custom event fired by the ES6 module script
        window.addEventListener('transcoder-ready', async () => {
            document.getElementById("generate-otp-btn").disabled = false;
        });
    </script>
</body>
</html>
