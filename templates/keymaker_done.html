<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Workflow Complete</title>
</head>
<body>
    <script>
        // Send message to the parent window
        window.parent.postMessage({ type: 'SHOW_ACCESS' }, window.location.origin);
    </script>
</body>
</html>
