<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resource Access</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans p-6 flex flex-col justify-center items-center">

    <div class="max-w-md w-full space-y-6">

        <!-- Resource Open Section -->
        <div class="bg-slate-800/60 border border-slate-700/80 rounded-xl p-5 shadow-lg backdrop-blur-sm">
            {% if resource_open %}
                <h2 class="text-sm font-bold text-white tracking-wide uppercase mb-3">Access open resource</h2>
                <div class="mb-4">
                    <label for="short-password" class="block text-slate-300 text-xs mb-1">Short Password</label>
                    <input type="password" id="short-password" placeholder="Enter p@5$w0rD" class="w-full px-3 py-2 text-xs bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none focus:border-blue-500">
                </div>
                <button id="access-resource-btn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium text-xs py-2 px-3 rounded-lg cursor-pointer transition-colors" disabled>
                    Access Resource
                </button>
            {% else %}
                <p class="text-slate-400 text-xs text-center py-2">Currently there are no open resource</p>
            {% endif %}
        </div>

        <!-- Access Key Section -->
        <div class="bg-slate-800/60 border border-slate-700/80 rounded-xl p-5 shadow-lg backdrop-blur-sm">
            {% if not access_key_set %}
                <h2 class="text-sm font-bold text-white tracking-wide uppercase mb-3">Create or open a resource with existing key</h2>
                <div class="mb-4">
                    <div class="flex justify-between items-center mb-1">
                        <label for="long-password" class="block text-slate-300 text-xs">Existing key (hex)</label>
                        <a href="#" id="generate-key-link" class="text-xs text-blue-400 hover:text-blue-300 underline">Generate a key</a>
                    </div>
                    <input type="password" id="hex-key" placeholder="Enter access code (hex string)" class="w-full px-3 py-2 text-xs bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none focus:border-blue-500">
                </div>
                <button id="create-key-btn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-xs py-2 px-3 rounded-lg cursor-pointer transition-colors" disabled>
                    Submit Key
                </button>
            {% else %}
                <p class="text-slate-400 text-xs text-center py-2">An access code is already set.</p>
            {% endif %}
        </div>

    </div>

    <!-- 1. YOUR NEW ES6 MODULE SCRIPT (Handles the setup and postMessage) -->
    <script type="module">
      window.addEventListener('message', async (event) => {
        const { type, scriptPath, cryptoKey, rules } = event.data;

        if (type === 'SETUP_TRANSCODER') {
          try {
            const module = await import(scriptPath);
            const TranscoderClass = module.default;

            // CRITICAL BRIDGE: Attach it directly to window.
            // This makes it visible to the classic script below.
            window.transcoderInstance = new TranscoderClass(cryptoKey, rules);

            // Notify the classic script that the transcoder is officially initialized
            window.dispatchEvent(new CustomEvent('transcoder-ready'));
          } catch (err) {
            console.error("Failed to initialize transcoder:", err);
          }
        }
      });
    </script>

    <script>
        async function encodeStringParam(param) {
            if (!window.transcoderInstance) {
                alert("Transcoder is still loading...");
                return;
            }

            try {
                // 1. Await the transcoder function just like a fetch call!
                const result = await window.transcoderInstance.encode_str(param);
                return result
            } catch (error) {
                console.error("String encoding operations failed:", error);
            }
            return ""
        }

        async function encodeFromHexStr(param) {
            try {
                const result = await window.transcoderInstance.encode(Uint8Array.fromHex(param));
                return result
            } catch (error) {
                console.error("String decoding operations failed:", error);
            }
            return "ERROR"
        }

        {% if resource_open %}
        document.getElementById('access-resource-btn')?.addEventListener('click', async (event) => {
            thekey = document.getElementById('short-password').value.trim()
            const encoded_key = await encodeStringParam(thekey)
            
            try {
                // 2. Send POST request with JSON payload
                const response = await fetch('/vault', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ action: 'set', password: encoded_key }),
                });
        
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
        
                // 3. Parse JSON and redirect
                const data = await response.json();
                
                if (data.redirect_url) {
                    window.location.href = data.redirect_url;
                } else {
                    throw new Error('No redirect URL provided by server');
                }
        
            } catch (error) {
                console.error('Transaction failed:', error);
                alert('Something went wrong. Please try again.');
            }
        });
        {% endif %}

        {% if not access_key_set %}
        document.getElementById('generate-key-link')?.addEventListener('click', (event) => {
            event.preventDefault();
            // Send message to parent frame to display the keymaker module
            window.parent.postMessage({ type: 'SHOW_KEYMAKER' }, '*');
        });

        document.getElementById('create-key-btn')?.addEventListener('click', async (event) => {
            thekey = document.getElementById('hex-key').value.trim()
            const encoded_key = await encodeFromHexStr(thekey)
            
            try {
                // 2. Send POST request with JSON payload
                const response = await fetch('/api/encoding', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ encoding: encoded_key }),
                });
        
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
        
                // 3. Parse JSON and redirect
                const data = await response.json();
                
                if (data.redirect_url) {
                    window.location.href = data.redirect_url;
                } else {
                    throw new Error('No redirect URL provided by server');
                }
        
            } catch (error) {
                console.error('Transaction failed:', error);
                alert('Something went wrong. Please try again.');
            }
        });
        {% endif %}
        
        // Wait for the custom event fired by the ES6 module script
        window.addEventListener('transcoder-ready', async () => {
            {% if resource_open %}
            document.getElementById("access-resource-btn").disabled = false;
            {% endif %}
            {% if not access_key_set %}
            document.getElementById("create-key-btn").disabled = false;
            {% endif %}
        });
    </script>
</body>
</html>
